<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        src: url(bricolage.woff2) format("woff2");
        font-weight: 200 800;
      }
      @font-face {
        font-family: Inter;
        src: url(inter.woff2) format("woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: Inter, sans-serif;
        background: #0b141a;
        color: #e9edef;
        position: relative;
      }
      #cap {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 330px;
        background: #fff;
        color: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 60px;
        z-index: 5;
      }
      #cap div {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 76px;
        letter-spacing: -2px;
        line-height: 1.05;
      }
      #hdr {
        position: absolute;
        left: 0;
        right: 0;
        top: 330px;
        height: 150px;
        background: #1f2c34;
        display: flex;
        align-items: center;
        gap: 26px;
        padding: 0 36px;
        z-index: 4;
      }
      .av {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: #0f9d4c;
        display: grid;
        place-items: center;
        font-size: 52px;
        flex: none;
      }
      #chat {
        position: absolute;
        left: 0;
        right: 0;
        top: 480px;
        height: 1080px;
        overflow: hidden;
        background: #0b141a;
      }
      #list {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        padding: 24px 34px 40px;
      }
      .m {
        display: flex;
        margin-top: 16px;
        opacity: 0;
      }
      .m.out {
        justify-content: flex-end;
      }
      .b {
        max-width: 860px;
        padding: 20px 30px 16px;
        border-radius: 28px;
        font-size: 50px;
        line-height: 1.28;
        background: #202c33;
        position: relative;
      }
      .m.in .b {
        border-top-left-radius: 6px;
      }
      .m.out .b {
        background: #005c4b;
        border-top-right-radius: 6px;
      }
      .n {
        font-size: 36px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .t {
        font-size: 26px;
        color: #8696a0;
        text-align: right;
        margin-top: 4px;
      }
      .chip {
        display: flex;
        justify-content: center;
        margin: 26px 0 8px;
        opacity: 0;
      }
      .chip span {
        background: #1f2c34;
        color: #c5ced3;
        font-size: 30px;
        font-weight: 600;
        padding: 10px 26px;
        border-radius: 16px;
      }
      .sys {
        display: flex;
        justify-content: center;
        margin-top: 16px;
        opacity: 0;
      }
      .typing {
        display: inline-flex;
        gap: 10px;
        padding: 26px 30px;
      }
      .typing i {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #8696a0;
        display: block;
      }
      #bar {
        position: absolute;
        left: 0;
        right: 0;
        top: 1560px;
        height: 130px;
        background: #0b141a;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 0 30px;
      }
      #bar .in {
        flex: 1;
        height: 96px;
        border-radius: 48px;
        background: #1f2c34;
        color: #8696a0;
        font-size: 38px;
        display: flex;
        align-items: center;
        padding: 0 40px;
      }
      #bar .mic {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: #00a884;
        display: grid;
        place-items: center;
        font-size: 44px;
      }
      #end {
        position: absolute;
        inset: 0;
        background: rgba(11, 20, 26, 0.94);
        opacity: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 80px;
      }
      .h {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        letter-spacing: -3px;
        line-height: 1.04;
      }
      .mk {
        color: #12161f;
        background: #d9f53b;
        border-radius: 14px;
        padding: 0 12px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="cap">
      <div>Splitting the bill<br />after the game 💀</div>
    </div>
    <div id="hdr">
      <div style="font-size: 56px; color: #aebac1">‹</div>
      <div class="av">⚽</div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 44px; font-weight: 700">Sunday Football ⚽</div>
        <div
          id="sub"
          style="
            font-size: 30px;
            color: #8696a0;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          "
        >
          Aman, Kabir, Sneha, Vikas +6, You
        </div>
      </div>
      <div style="font-size: 44px; color: #aebac1; letter-spacing: 20px">📹📞</div>
    </div>
    <div id="chat"><div id="list"></div></div>
    <div id="bar">
      <div class="in">😊 &nbsp;Message</div>
      <div class="mic">🎤</div>
    </div>
    <div id="end">
      <div class="h" style="font-size: 112px">
        Every group has<br />this <span class="mk">one guy</span> 😭
      </div>
      <div class="h" style="font-size: 84px; margin-top: 70px; letter-spacing: -2px">
        Tag your money collector 👇
      </div>
      <div style="margin-top: 120px; display: flex; align-items: center; gap: 22px">
        <div
          style="
            width: 100px;
            height: 100px;
            border-radius: 28px;
            background: #0f9d4c;
            display: grid;
            place-items: center;
          "
        >
          <svg
            width="62"
            height="62"
            viewBox="0 0 24 24"
            fill="#d9f53b"
            stroke="#d9f53b"
            stroke-width="1"
            stroke-linejoin="round"
          >
            <path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z" />
          </svg>
        </div>
        <div style="text-align: left">
          <div class="h" style="font-size: 60px; letter-spacing: -1px">TownPlay</div>
          <div style="font-size: 32px; color: #c9d1cc; font-weight: 600; margin-top: 4px">
            Book · play · split the bill
          </div>
        </div>
      </div>
      <div style="margin-top: 40px; font-size: 40px; font-weight: 700; color: #d9f53b">
        Everyone pays before the game ✅
      </div>
    </div>
    <script>
      const C = {
        Aman: "#53bdeb",
        Rahul: "#ff72a1",
        Kabir: "#ffd279",
        Sneha: "#a5b337",
        Vikas: "#fc9775",
      };
      const S = [
        ["You", "Turf ₹1,200 ka tha. Sab ₹120 bhejo 🙏", "10:42 PM", 0.0],
        ["Aman", "Done ✅", "10:43 PM", 0.7],
        ["chip", "Seen by 8 👀", 1.4],
        ["You", "Baaki log?? 😐", "10:50 PM", 2.0],
        ["Kabir", "Bhai UPI down hai 🥲", "10:51 PM", 2.7],
        ["Vikas", "Kal pakka bhejta hoon", "10:51 PM", 3.3],
        ["Sneha", "Maine toh sirf 10 min khela 😅", "10:52 PM", 3.9],
        ["You", "Next week turf main book nahi karunga 😤", "10:53 PM", 4.6],
        ["typing", "Kabir", 5.4],
        ["Kabir", "Bhai next Sunday ka plan? 🔥😂", "10:54 PM", 6.2],
      ];
      const L = document.getElementById("list");
      const els = [];
      S.forEach((s, i) => {
        let e = document.createElement("div");
        if (s[0] === "chip") {
          e.className = "chip";
          e.innerHTML = `<span>${s[1]}</span>`;
          e.dataset.at = s[2];
        } else if (s[0] === "typing") {
          e.className = "m in";
          e.innerHTML = `<div class="b"><div class="n" style="color:${C[s[1]]}">${s[1]}</div><div class="typing"><i></i><i></i><i></i></div></div>`;
          e.dataset.at = s[2];
          e.dataset.until = 6.2;
          e.dataset.typing = 1;
        } else {
          const out = s[0] === "You";
          e.className = "m " + (out ? "out" : "in");
          e.innerHTML = `<div class="b">${out ? "" : `<div class="n" style="color:${C[s[0]]}">${s[0]}</div>`}<div>${s[1]}</div><div class="t">${s[2]}${out ? ' <span style="color:#53bdeb">✓✓</span>' : ""}</div></div>`;
          e.dataset.at = s[3];
        }
        L.appendChild(e);
        els.push(e);
      });
      const VIEW = 1080;
      const cl = (v) => Math.max(0, Math.min(1, v)),
        p = (t, a, d) => cl((t - a) / d),
        out = (x) => 1 - Math.pow(1 - x, 3);
      const back = (x) => {
        const c1 = 1.6,
          c3 = c1 + 1;
        return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      };
      // precompute layout bottoms with all visible (typing removed after until)
      function bottomsAt(t) {
        // layout bottom of last visible element
        let y = 24,
          last = 0;
        els.forEach((e) => {
          const at = +e.dataset.at;
          const vis = t >= at && !(e.dataset.typing && t >= +e.dataset.until);
          if (!vis) return;
          const cs = getComputedStyle(e);
          y += parseFloat(cs.marginTop) + e.offsetHeight;
          last = y;
        });
        return last + 40;
      }
      const events = [...new Set(els.map((e) => +e.dataset.at).concat([6.2]))].sort(
        (a, b) => a - b,
      );
      window.render = function (t) {
        els.forEach((e) => {
          const at = +e.dataset.at;
          let vis = t >= at;
          if (e.dataset.typing && t >= +e.dataset.until) vis = false;
          e.style.display = vis ? "" : "none";
          if (!vis) return;
          const k = at === 0 ? 1 : p(t, at, 0.22);
          e.style.opacity = Math.min(1, k * 1.6);
          e.style.transform = `translateY(${(1 - out(k)) * 30}px) scale(${0.9 + 0.1 * back(k)})`;
          e.style.transformOrigin = e.classList.contains("out") ? "right bottom" : "left bottom";
          if (e.dataset.typing) {
            [...e.querySelectorAll("i")].forEach((d, j) => {
              d.style.transform = `translateY(${Math.sin(t * 9 - j * 0.9) * -7}px)`;
              d.style.opacity = 0.5 + 0.5 * Math.max(0, Math.sin(t * 9 - j * 0.9));
            });
          }
        });
        // scroll: ease between successive targets
        let prevT = 0,
          tgt = 0;
        for (const ev of events) {
          if (ev > t) break;
          const target = Math.max(0, bottomsAt(ev + 0.001) - VIEW);
          const k = out(p(t, ev, 0.25));
          tgt = prevT + (target - prevT) * k;
          prevT = target;
        }
        L.style.transform = `translateY(${-tgt}px)`;
        document.getElementById("sub").textContent =
          t >= 5.4 && t < 6.2 ? "Kabir is typing…" : "Aman, Kabir, Sneha, Vikas +6, You";
        const ek = p(t, 7.3, 0.4);
        const en = document.getElementById("end");
        en.style.opacity = ek;
        en.firstElementChild.style.transform = `scale(${0.85 + 0.15 * back(ek)})`;
      };
      render(0);
    </script>
  </body>
</html>
